<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Chingonamics Radio: stream the official Chingonamics tracks, meme anthems and community drops. Pure Mexican meme machine sound.">
    <link rel="canonical" href="https://chingonamics.com/radio.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chingonamics.com/radio.html">
    <meta property="og:title" content="Chingonamics Radio | Meme Machine Sound">
    <meta property="og:description" content="Stream Chingonamics Radio: meme anthems, community drops and pure chingonería.">
    <meta property="og:image" content="https://chingonamics.com/IMG_0325.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chingonamics Radio | Meme Machine Sound">
    <meta name="twitter:description" content="Stream Chingonamics Radio: meme anthems, community drops and pure chingonería.">
    <meta name="twitter:image" content="https://chingonamics.com/IMG_0325.jpg">
    <title>Chingonamics Radio | Meme Machine Sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #006847;
            --white: #FFFFFF;
            --red: #CE252B;
            --gold: #FFD700;
            --orange: #FF7A18;
            --dark: #0A0A0A;
            --card-bg: #141414;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,122,24,0.28) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            top: 20%;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid #222;
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .flag-bar {
            display: flex;
            height: 6px;
            width: 100%;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .flag-bar .g { background: var(--green); flex: 1; }
        .flag-bar .w { background: var(--white); flex: 1; }
        .flag-bar .r { background: var(--red); flex: 1; }

        .badge {
            display: inline-block;
            background: rgba(255, 122, 24, 0.12);
            color: var(--orange);
            border: 1px solid var(--orange);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(1.5rem, 6.5vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFF 0%, #AAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .player {
            background: #101010;
            border: 2px solid #242424;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: left;
            margin-bottom: 28px;
        }

        .now-playing-label {
            color: var(--orange);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 1.35rem;
            font-weight: 900;
            margin: 6px 0 4px;
        }

        .now-playing-meta {
            color: #8f8f8f;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 34px;
            margin-bottom: 16px;
        }

        .equalizer span {
            width: 6px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--gold) 0%, var(--orange) 100%);
            height: 20%;
        }

        .equalizer.is-playing span {
            animation: bounce 900ms ease-in-out infinite;
        }

        .equalizer span:nth-child(2) { animation-delay: 120ms; }
        .equalizer span:nth-child(3) { animation-delay: 240ms; }
        .equalizer span:nth-child(4) { animation-delay: 360ms; }
        .equalizer span:nth-child(5) { animation-delay: 480ms; }
        .equalizer span:nth-child(6) { animation-delay: 600ms; }
        .equalizer span:nth-child(7) { animation-delay: 720ms; }

        @keyframes bounce {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: #8f8f8f;
            font-size: 0.8rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--orange);
            cursor: pointer;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            border: 1px solid #333;
            background: #171717;
            color: var(--white);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover:not(:disabled) {
            border-color: var(--orange);
            color: var(--orange);
        }

        .control-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, var(--orange) 0%, #FFB347 100%);
            border-color: transparent;
            color: #1A1A1A;
            min-width: 120px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            flex: 1;
            color: #8f8f8f;
            font-size: 0.85rem;
        }

        .player-status {
            margin-top: 14px;
            color: #8f8f8f;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .playlist-heading {
            display: block;
            color: var(--orange);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: left;
            margin-bottom: 10px;
        }

        .playlist-heading[hidden] { display: none; }

        .playlist {
            list-style: none;
            display: grid;
            gap: 10px;
            text-align: left;
            margin-bottom: 28px;
        }

        .playlist[hidden] { display: none; }

        .playlist button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--white);
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .playlist button:hover,
        .playlist button:focus-visible {
            border-color: var(--orange);
            transform: translateY(-2px);
        }

        .playlist button[aria-current="true"] {
            border-color: var(--orange);
            box-shadow: 0 10px 26px rgba(255, 122, 24, 0.18);
        }

        .track-subtitle {
            display: block;
            color: #8f8f8f;
            font-size: 0.8rem;
            font-weight: 400;
            margin-top: 4px;
        }

        .radio-fallback {
            border: 1px dashed #333;
            border-radius: 16px;
            padding: 22px 18px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .radio-fallback strong { color: var(--orange); }

        .featured-heading {
            display: block;
            color: var(--orange);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: left;
            margin-bottom: 10px;
        }

        .featured-player {
            background: #101010;
            border: 2px solid #242424;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .featured-player iframe {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 10px;
        }

        .featured-list {
            list-style: none;
            display: grid;
            gap: 10px;
            text-align: left;
            margin-bottom: 28px;
        }

        .featured-list button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--white);
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .featured-list button:hover,
        .featured-list button:focus-visible {
            border-color: var(--orange);
            transform: translateY(-2px);
        }

        .featured-list button[aria-current="true"] {
            border-color: var(--orange);
            box-shadow: 0 10px 26px rgba(255, 122, 24, 0.18);
        }

        .cta-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-pump {
            background: linear-gradient(135deg, #006847 0%, #00B377 100%);
            color: var(--white);
            box-shadow: 0 8px 25px rgba(0, 179, 119, 0.3);
        }

        .btn-pump:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 179, 119, 0.5);
        }

        .btn-x {
            background: #111;
            color: var(--white);
            border: 1px solid #333;
        }

        .btn-x:hover {
            background: #1A1A1A;
            border-color: #555;
            transform: translateY(-2px);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn, .control-btn, .playlist button { transition: none; }
            .equalizer.is-playing span { animation: none; height: 60%; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 28px 18px; }
            .control-btn { flex: 1; }
            .volume-control { width: 100%; }
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #808080;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <main class="container">
        <div class="flag-bar">
            <div class="g"></div>
            <div class="w"></div>
            <div class="r"></div>
        </div>

        <span class="badge">📻 Chingonamics Radio</span>

        <h1>Chingonamics Radio</h1>
        <p class="subtitle">Meme anthems, community drops and pure <i>chingonería</i> — straight from the machine, streamed right here.</p>

        

        

        <h2 class="featured-heading">📻 Now Playing — Chingonamics Radio</h2>

        <div class="featured-player">
            <iframe id="featured-iframe" title="Chingonamics featured track on SoundCloud"
                loading="lazy"
                scrolling="no"
                frameborder="no"
                allow="autoplay"
                height="120"></iframe>
        </div>
        <ul class="featured-list" id="featured-list"></ul>

        <div class="cta-box">
            <a href="/videos.html" class="btn btn-x">
                <span>📺 Watch the Videos</span>
            </a>
            <a href="https://x.com/chingonamics?s=11" target="_blank" rel="noopener noreferrer" class="btn btn-x">
                <span>𝕏 Follow @chingonamics</span>
            </a>
            <a href="/" class="btn btn-pump">
                <span>← Back to Chingonamics</span>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 Chingonamics. NFA. DYOR.
    </footer>


    <script>
        // Featured Drops: individual SoundCloud tracks highlighted outside the self-hosted
        // player above. Only one SoundCloud embed is ever loaded at a time (whichever track
        // is selected below), which keeps this section lightweight no matter how many tracks
        // are listed. To add a track, append { title, url } to this array (newest last).
        const featuredTracks = [
            { title: 'De Veras?', url: 'https://soundcloud.com/eaallupinyou/de-veras-10-7-24-2-29-pm-m4a' },

            { title: 'Drop #2', url: 'https://on.soundcloud.com/ezZIklnOmwhONNtBR8' },
            { title: 'Drop #3', url: 'https://on.soundcloud.com/Ryq7AJZWiITp0045tC' },
            { title: 'Drop #4', url: 'https://on.soundcloud.com/boYKZ2vr735rde3IT1' },
            { title: 'Drop #5', url: 'https://on.soundcloud.com/2IjyAY95tvt2Wjqe06' },
            { title: 'Drop #6', url: 'https://on.soundcloud.com/UtzKIyjmUHxS8WVvK5' },
            { title: 'Drop #7', url: 'https://on.soundcloud.com/YV3JmyPdrbfhwAQ3Fm' },
            { title: 'Drop #8', url: 'https://on.soundcloud.com/1EDdykrhSS1fZqDiFM' },
            { title: 'Drop #9', url: 'https://on.soundcloud.com/rAKiaCwv9QCOSgOhmg' },
            { title: 'Drop #10', url: 'https://on.soundcloud.com/dmQdlGlzI6YGIxWzVm' },
            { title: 'Drop #11', url: 'https://on.soundcloud.com/xY3X0hnBLTBuMRoPo4' },
            { title: 'Drop #12', url: 'https://on.soundcloud.com/lp0ZnLav7pBw5moCpD' },
            { title: 'Drop #13', url: 'https://on.soundcloud.com/FplSRuVLusonkFyo6t' },
            { title: 'Drop #14', url: 'https://on.soundcloud.com/rtL4pz0fT5iAe1rbDF' },
            { title: 'Drop #15', url: 'https://on.soundcloud.com/iUCLg5TJCw4O7DDoLu' },
            { title: 'Drop #16', url: 'https://on.soundcloud.com/IQSIPAeAvkOMpxZvvW' },
            { title: 'Drop #17', url: 'https://on.soundcloud.com/DMtEmMoS8VgRgCFCXC' },
            { title: 'Drop #18', url: 'https://on.soundcloud.com/CprfTfHCmLrwXnWsOZ' },
            { title: 'Drop #19', url: 'https://on.soundcloud.com/6CBJZwbXafNjNMSSfU' },
            { title: 'Drop #20', url: 'https://on.soundcloud.com/QwgjarLAfv5lnCIVHG' },
            { title: 'Drop #21', url: 'https://on.soundcloud.com/07aVIxEXcceKP6jfwI' },
        ];

        const featuredIframe = document.getElementById('featured-iframe');
        const featuredListEl = document.getElementById('featured-list');
        let currentFeaturedIndex = 0;

        function buildFeaturedEmbedUrl(trackUrl) {
            const encoded = encodeURIComponent(trackUrl);
            return `https://w.soundcloud.com/player/?url=${encoded}&color=%23ff7a18&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false`;
        }

        function loadFeaturedTrack(index) {
            if (!featuredTracks.length) return;
            currentFeaturedIndex = (index + featuredTracks.length) % featuredTracks.length;
            featuredIframe.src = buildFeaturedEmbedUrl(featuredTracks[currentFeaturedIndex].url);
            renderFeaturedList();
        }

        function renderFeaturedList() {
            featuredListEl.innerHTML = '';
            featuredTracks.forEach((track, index) => {
                const item = document.createElement('li');
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = track.title;
                button.setAttribute('aria-current', index === currentFeaturedIndex ? 'true' : 'false');
                button.addEventListener('click', () => loadFeaturedTrack(index));
                item.appendChild(button);
                featuredListEl.appendChild(item);
            });
        }

        if (featuredTracks.length) {
            loadFeaturedTrack(0);
        }
    </script>
</body>
</html>
