<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Chingonamics logo</title>
  <desc id="logoDesc">Dark industrial Chingonamics logo with orange highlights and index-inspired bars.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8a317" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect x="34" y="34" width="1132" height="562" rx="22" fill="none" stroke="#243040" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="70" rx="22" fill="#080b10"/>

  <text x="70" y="78" fill="#e8a317" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" font-size="26" letter-spacing="3">CHINGONAMICS // OCCUPANCY DESK</text>

  <rect x="70" y="146" width="1060" height="174" rx="16" fill="#0d1218" stroke="#243040" stroke-width="2"/>
  <rect x="70" y="146" width="1060" height="174" rx="16" fill="url(#accentGlow)"/>

  <text x="98" y="238" fill="#e6edf3" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="8">CHINGONAMICS</text>
  <text x="102" y="287" fill="#8b97a6" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" font-size="24" letter-spacing="4">WE SCORE THE PLANT. NOT THE LETTERHEAD.</text>

  <rect x="70" y="360" width="1060" height="190" rx="16" fill="#0d1218" stroke="#243040" stroke-width="2"/>

  <text x="98" y="404" fill="#e8a317" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" font-size="22" letter-spacing="2">INDEX SNAPSHOT</text>

  <g font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" fill="#e6edf3">
    <text x="98" y="447">AEROSPACE &amp; SPACE</text>
    <text x="98" y="491">PLANTS</text>
    <text x="98" y="535">PORTS &amp; MOVEMENT</text>
  </g>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" font-size="32" text-anchor="end">
    <text x="1098" y="447" fill="#e8a317">108</text>
    <text x="1098" y="491" fill="#d16b5a">92</text>
    <text x="1098" y="535" fill="#e8a317">106</text>
  </g>

  <line x1="430" y1="438" x2="1048" y2="438" stroke="#243040" stroke-width="2"/>
  <line x1="430" y1="482" x2="1048" y2="482" stroke="#243040" stroke-width="2"/>
  <line x1="430" y1="526" x2="1048" y2="526" stroke="#243040" stroke-width="2"/>

  <rect x="430" y="423" width="540" height="20" rx="10" fill="#1b2533"/>
  <rect x="430" y="423" width="420" height="20" rx="10" fill="#e8a317"/>

  <rect x="430" y="467" width="540" height="20" rx="10" fill="#1b2533"/>
  <rect x="430" y="467" width="290" height="20" rx="10" fill="#d16b5a"/>

  <rect x="430" y="511" width="540" height="20" rx="10" fill="#1b2533"/>
  <rect x="430" y="511" width="390" height="20" rx="10" fill="#e8a317"/>
</svg>
