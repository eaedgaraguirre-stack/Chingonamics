<html lang="en">
<head>

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Chingonamics",

    </script>
    <title>Chingonamics | The Mexican Meme Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #006847;
            --white: #FFFFFF;
            --red: #CE252B;
            --gold: #FFD700;
            --dark: #0A0A0A;
            --card-bg: #141414;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-image: url('bg.jpg.PNG');
            background-size: 300px auto;
            background-position: 0 0;
            background-repeat: repeat;
            background-attachment: fixed;
            background-color: var(--dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(206,37,43,0.3) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            top: 20%;
        }

        .video-hero {
            position: relative;
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            z-index: 1;
        }

        .hero-video {
            display: block;
            width: 100%;
            height: auto;
        }

        .hero-tagline {
            color: var(--gold);
            font-size: 1.15rem;
            font-weight: 700;
            margin: -4px 0 14px;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(10,10,10,0.6) 100%);
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid #222;
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .flag-bar {
            display: flex;
            height: 6px;
            width: 100%;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .flag-bar .g { background: var(--green); flex: 1; }
        .flag-bar .w { background: var(--white); flex: 1; }
        .flag-bar .r { background: var(--red); flex: 1; }

        .badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(1.5rem, 6.5vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFF 0%, #AAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .cta-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-pump {
            background: linear-gradient(135deg, #006847 0%, #00B377 100%);
            color: var(--white);
            box-shadow: 0 8px 25px rgba(0, 179, 119, 0.3);
        }

        .btn-pump:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 179, 119, 0.5);
        }

        .btn-x {
            background: #111;
            color: var(--white);
            border: 1px solid #333;
        }

        .btn-x:hover {
            background: #1A1A1A;
            border-color: #555;
            transform: translateY(-2px);
        }

        .share-section, .community-section {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .section-heading {
            color: var(--gold);
            font-size: 1.45rem;
            margin-bottom: 14px;
        }

        .share-buttons, .official-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .share-button, .official-link {
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            background: #111;
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .share-button:hover, .official-link:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .community-copy, .risk-note {
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .launches-section {
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .portfolio-section {
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .portfolio-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portfolio-card {
            max-width: 560px;
            margin: 0 auto;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            align-items: stretch;
            max-height: 72vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .token-card {
            flex: 0 0 100%;
            background: var(--card-bg);
            border: 2px solid #222;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: left;
        }

        .token-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.2);
        }

        .featured-token-card {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.15);
        }

        .token-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .token-content {
            padding: 20px;
        }

        .token-ticker {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .token-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .launch-status {
            color: #61e294;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .contract-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            color: #777;
            font-size: 0.75rem;
        }

        .copy-contract {
            border: 1px solid #444;
            border-radius: 6px;
            background: transparent;
            color: var(--gold);
            padding: 4px 7px;
            cursor: pointer;
        }

        .token-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .token-name {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--white);
            text-transform: uppercase;
        }

        .token-description {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .token-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #006847 0%, #00B377 100%);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .token-button:hover {
            box-shadow: 0 8px 20px rgba(0, 179, 119, 0.4);
            transform: translateY(-2px);
        }

        .token-share {
            border: 1px solid var(--green);
            border-radius: 10px;
            background: transparent;
            color: var(--white);
            font-weight: 700;
            cursor: pointer;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-video { display: none; }
            .video-hero { background: url('IMG_0325.png') center / cover; min-height: 220px; }
            .btn, .token-card { transition: none; }
        }

        @media (max-width: 860px) {
            .portfolio-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 28px 18px; }
            .share-buttons, .official-links { grid-template-columns: 1fr; }
            .portfolio-title { font-size: 1.65rem; }
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #444;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="video-hero">
        <video autoplay muted loop playsinline poster="IMG_0325.png" class="hero-video">
            <source src="_users_b7c824c7-4b1c-403b-93b7-0ec6eff1df3c_generated_b8b7bb04-0586-46dd-bab8-cee206c3e80b_generated_video.mp4" type="video/mp4">
            Your browser doesn't support HTML5 video.
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="container">
        <div class="flag-bar">
            <div class="g"></div>
            <div class="w"></div>
            <div class="r"></div>
        </div>

        <span class="badge">🔥 Next Launch Pending</span>

        <h1>CHINGONAMICS</h1>
        <p class="hero-tagline">The Mexican Meme Machine.</p>
        <p class="subtitle">High-octane community launches, legendary memes, and pure <i>chingonería</i>. No boring tokens allowed.</p>

        <div class="cta-box">
            <a href="https://pump.fun/join/Chingonamics" target="_blank" class="btn btn-pump">
                <span>🚀 Join the Meme Machine</span>
            </a>
            <a href="https://x.com/chingonamics?s=11" target="_blank" class="btn btn-x">
                <span>𝕏 Follow @chingonamics</span>
            </a>
        </div>
    </div>

    <section class="share-section" aria-labelledby="share-heading">
        <h2 class="section-heading" id="share-heading">Spread the Chingonería</h2>
        <div class="share-buttons">
            <button class="share-button" type="button" data-share="x">𝕏 Share on X</button>
            <button class="share-button" type="button" data-share="telegram">✈️ Telegram</button>
            <button class="share-button" type="button" data-share="whatsapp">💬 WhatsApp</button>
            <button class="share-button" type="button" data-share="copy">🔗 Copy Link</button>
        </div>
    </section>

    <section class="launches-section" aria-labelledby="launches-heading">
        <h2 class="section-heading" id="launches-heading">🚀 Our Launches</h2>
        <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>

    

    <footer>
        &copy; 2026 Chingonamics. NFA. DYOR.
    </footer>

    <script>
        function copyText(value) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(value);
            }

            const tempInput = document.createElement('textarea');
            tempInput.value = value;
            tempInput.setAttribute('readonly', '');
            tempInput.style.position = 'fixed';
            tempInput.style.top = '-9999px';
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            return Promise.resolve();
        }

        function shareUrl(message, url, platform) {
            const encodedMessage = encodeURIComponent(message);
            const encodedUrl = encodeURIComponent(url);
            const shareLinks = {
                x: `https://twitter.com/intent/tweet?text=${encodedMessage}&url=${encodedUrl}`,
                telegram: `https://t.me/share/url?url=${encodedUrl}&text=${encodedMessage}`,
                whatsapp: `https://api.whatsapp.com/send?text=${encodedMessage}%20${encodedUrl}`
            };
            if (platform === 'copy') {
                copyText(url).then(() => alert('Link copied!'));
            } else {
                window.open(shareLinks[platform], '_blank', 'noopener,noreferrer');
            }
        }

        // Fallback data (used only if coins.json hasn't been generated yet).
        // The GitHub Actions workflow keeps coins.json up to date automatically.
        const fallbackPumpCoins = [
            {
                name: 'Selena',
                ticker: '$SELENA',
                status: 'Latest',
                image: 'IMG_0440.jpeg?v=20260904',
                contract: 'Gzt4drLVHDkoNrjJ4JfZg1Zx62DePRpwtX8vB9C1pump',
                pumpUrl: 'https://pump.fun/coin/Gzt4drLVHDkoNrjJ4JfZg1Zx62DePRpwtX8vB9C1pump',
                about: 'Iconic Selena energy with a fresh meme punch and a bright spot in the Chingonamics Pump account lineup.'
            }
        ];

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderPumpCoins(coins) {
            const container = document.getElementById('portfolio-grid');
            if (!container) return;

            if (!Array.isArray(coins) || coins.length === 0) {
                container.innerHTML = '<p class="community-copy">No launches found yet. Stay tuned!</p>';
                return;
            }

            container.innerHTML = coins.map((coin, index) => {
                const isFeatured = index === 0;
                const name = escapeHtml(coin.name || 'Unknown');
                const ticker = escapeHtml(coin.ticker || '');
                const image = escapeHtml(coin.image || '');
                const contract = escapeHtml(coin.contract || '');
                const pumpUrl = escapeHtml(coin.pumpUrl || '#');
                const about = escapeHtml(coin.about || '');
                const status = escapeHtml(coin.status || (isFeatured ? 'Latest' : ''));
                const shortContract = contract ? escapeHtml(contract.slice(0, 4)) + '...pump' : '';
                return `
                    <article class="token-card ${isFeatured ? 'featured-token-card' : ''}">
                        ${image ? `<img src="${image}" alt="${name} meme coin artwork" class="token-image" loading="lazy">` : ''}
                        <div class="token-content">
                            <div class="token-meta">
                                <span class="token-ticker">${ticker}</span>
                                ${status ? `<span class="launch-status">● ${status}</span>` : ''}
                            </div>
                            <h3 class="token-name">${name}</h3>
                            ${about ? `<p class="token-description">${about}</p>` : ''}
                            ${contract ? `
                            <div class="contract-row">
                                <span>CA: ${shortContract}</span>
                                <button class="copy-contract" type="button" data-contract="${contract}">Copy</button>
                            </div>` : ''}
                            <div class="token-actions">
                                <a href="${pumpUrl}" target="_blank" rel="noopener noreferrer" class="token-button">🚀 View Coin</a>
                                <button class="token-share" type="button" data-share-token="${name}" data-share-url="${pumpUrl}">Share</button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function bindLaunchInteractions() {
            document.querySelectorAll('[data-share-token]').forEach((button) => {
                button.addEventListener('click', () => {
                    shareUrl(`Check out ${button.dataset.shareToken} on Chingonamics 🔥`, button.dataset.shareUrl, 'x');
                });
            });

            document.querySelectorAll('[data-contract]').forEach((button) => {
                button.addEventListener('click', () => {
                    copyText(button.dataset.contract).then(() => {
                        const previousText = button.textContent;
                        button.textContent = 'Copied!';
                        setTimeout(() => { button.textContent = previousText; }, 1500);
                    });
                });
            });
        }

        async function loadPumpCoins() {
            try {
                // Cache-bust so visitors always get the freshest list the workflow produced.
                const response = await fetch('coins.json?v=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('coins.json not available');
                const coins = await response.json();
                renderPumpCoins(coins);
            } catch (err) {
                renderPumpCoins(fallbackPumpCoins);
            }
            bindLaunchInteractions();
        }

        loadPumpCoins();

        document.querySelectorAll('[data-share]').forEach((button) => {
            button.addEventListener('click', () => {
                shareUrl('Join the Chingonamics Meme Machine 🔥', window.location.href, button.dataset.share);
            });
        });
    </script>

</body>
</html>
