            height: 6px;

        }

        .flag-bar .w { background: var(--white); flex: 1; }
        .flag-bar .r { background: var(--red); flex: 1; }

        .badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(1.5rem, 6.5vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFF 0%, #AAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
            text-align: left;
        }

        .video-card {
            display: flex;
            justify-content: center;
            min-width: 0;
        }

        .video-card .twitter-tweet {

        }

        .cta-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;

        .btn-pump {
            background: linear-gradient(135deg, #006847 0%, #00B377 100%);
            color: var(--white);

    <script>
        // Lazy-load Twitter/X embeds: only convert a card into a full embed once
        // it actually scrolls near the viewport, instead of loading all cards at
        // once. Keeps the page fast no matter how many videos get added later.
        let twitterWidgetsPromise = null;

        function loadTwitterWidgets() {
            if (twitterWidgetsPromise) return twitterWidgetsPromise;
            twitterWidgetsPromise = new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://platform.twitter.com/widgets.js';
                script.async = true;
                script.onload = () => resolve(window.twttr);
                document.body.appendChild(script);
            });
            return twitterWidgetsPromise;
        }

        const videoCards = document.querySelectorAll('.video-card');

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    observer.unobserve(entry.target);
                    loadTwitterWidgets().then((twttr) => {
                        if (twttr && twttr.widgets) {
                            twttr.widgets.load(entry.target);
                        }
                    });
                });
            }, { rootMargin: '400px 0px' });

            videoCards.forEach((card) => observer.observe(card));
        } else {
            // Fallback for older browsers without IntersectionObserver support:
            // just load everything immediately, same as before.
            loadTwitterWidgets().then((twttr) => {
                if (twttr && twttr.widgets) twttr.widgets.load();
            });
        }
    </script>
